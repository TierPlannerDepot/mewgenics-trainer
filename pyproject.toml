[project]
name = "mewgenics-trainer"
version = "0.9.3"
description = "External memory trainer for Mewgenics (Windows)"
requires-python = ">=3.10"
authors = [{ name = "mewgenics-trainer contributors" }]
license = { text = "MIT" }
dependencies = [
    "pymem>=1.11",
    "pywin32>=306",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "psutil>=5.9",
    "colorama>=0.4.6",
]

[project.scripts]
mewtrainer = "mewgenics_trainer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"